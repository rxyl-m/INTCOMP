<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LandingPage</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;0,9..144,900;1,9..144,600&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');
    
        body {
            background-color: #fffae2;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            position: relative;
            background-image:
                radial-gradient(circle, rgba(50,37,107,0.13) 1.4px, transparent 1.4px);
            background-size: 28px 28px;
        }

        /* ---- Decorative geometry layer ---- */
        .geo-field {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }
        .geo {
            position: absolute;
            opacity: 0.9;
        }
        .geo-triangle {
            width: 0;
            height: 0;
            border-left: 22px solid transparent;
            border-right: 22px solid transparent;
            border-bottom: 38px solid #ff8552;
        }
        .geo-circle-outline {
            border-radius: 50%;
            border: 4px solid #32256b;
        }
        .geo-circle-fill {
            border-radius: 50%;
            background-color: #ffd23f;
        }
        .geo-square {
            border: 4px solid #ff8552;
            transform: rotate(18deg);
        }
        .geo-plus {
            position: absolute;
        }
        .geo-plus::before,
        .geo-plus::after {
            content: "";
            position: absolute;
            background-color: #32256b;
        }
        .geo-plus::before {
            width: 26px;
            height: 4px;
            top: 11px;
            left: 0;
        }
        .geo-plus::after {
            width: 4px;
            height: 26px;
            top: 0;
            left: 11px;
        }
        .geo-dash {
            border-bottom: 4px dashed #32256b;
        }

        @keyframes drift {
            0%, 100% { transform: translateY(0) rotate(var(--r, 0deg)); }
            50% { transform: translateY(-16px) rotate(var(--r, 0deg)); }
        }
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .geo-float { animation: drift 6s ease-in-out infinite; }
        .geo-spin { animation: spin-slow 18s linear infinite; }

        @media (prefers-reduced-motion: reduce) {
            .geo-float, .geo-spin { animation: none; }
        }

        .hero, .help, .tool-button {
            position: relative;
            z-index: 1;
        }

        .scribble-underline {
            display: block;
            margin-top: -1.5rem;
            margin-left: 10.5rem;
        }
        .hero {
            font-family: 'Fraunces', serif;
            font-size: 6rem;
            font-weight: 700;
            color: #32256b;
            margin-top: 10rem;
            margin-left: 10rem;
        }
        .hero2 {
            font-family: 'Fraunces', serif;
            font-size: 8rem;
            font-weight: 900;
            color: #181818;
            position: relative;
            top: -2.5rem;
        }
        .help {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            color: #535353;
            position: relative;
            top: -8.5rem;
            margin-left: 10rem;
            max-width: 600px;
            text-indent: 2rem;
        }
        
        .side-panel {
        position: fixed;
        top: 7rem;
        right: 0;
        width: 300px;
        height: 400px;
        background-color: #fcf9ee;
        box-shadow: -5px 0 15px rgba(0, 0, 0, 0.1);
        padding: 40px;
        border-radius: 1rem;
        
        transform: translateX(130%); 
        
        transition: transform 0.3s ease-in-out; 
        z-index: 1000;
        }

        .side-panel.active {
        transform: rotate(350deg) translateX(20%);
        }
        .side-panel:hover {
        transform: rotate(355deg) scale(1.05);
        }
        .link-button {
            display: inline-block;
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            background-color: #ffffff;
            color: #2b2b2b;
            border: 3px solid #32256b;
            border-radius: 10rem;
            margin-left: 10rem;
            padding: 1rem 1.5rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            position: relative;
            top: -8.5rem;
        }
        .link-button:hover {
            background-color: #32256b;
            color: #ffffff;
        }

        /* ---- Floating "dancing" images ---- */
        .dance-field {
            position: absolute;
            top: -100px;
            right: -10px;
            width: 40%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .dance-img {
            position: absolute;
            width: 130px;
            height: 130px;
            object-fit: cover;
            border-radius: 1.2rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
            animation: dance 7s ease-in-out infinite;
        }

        @keyframes dance {
            0%   { transform: translate(0, 0) rotate(var(--r, 0deg)); }
            25%  { transform: translate(12px, -18px) rotate(calc(var(--r, 0deg) + 4deg)); }
            50%  { transform: translate(-8px, -6px) rotate(calc(var(--r, 0deg) - 3deg)); }
            75%  { transform: translate(10px, 10px) rotate(calc(var(--r, 0deg) + 2deg)); }
            100% { transform: translate(0, 0) rotate(var(--r, 0deg)); }
        }

        @media (prefers-reduced-motion: reduce) {
            .dance-img { animation: none; }
        }
    </style>
</head>
<body>
    <script src="loading-screen.js" defer></script>
    <div class="geo-field" aria-hidden="true">
        <div class="geo geo-triangle geo-float" style="top: 4rem; left: 4rem; --r: -12deg; transform: rotate(-12deg);"></div>
        <div class="geo geo-circle-outline geo-float" style="width: 60px; height: 60px; top: 9rem; left: 2.5rem; animation-delay: .8s;"></div>
        <div class="geo geo-circle-fill geo-float" style="width: 18px; height: 18px; top: 3.5rem; left: 46%; animation-delay: 1.4s;"></div>
        <div class="geo geo-plus geo-float" style="top: 15rem; left: 6rem; animation-delay: .3s;"></div>
        <div class="geo geo-square geo-spin" style="width: 34px; height: 34px; top: 7rem; right: 22rem;"></div>
        <div class="geo geo-triangle geo-float" style="top: 22rem; right: 26rem; transform: rotate(150deg); animation-delay: 1.1s;"></div>
        <div class="geo geo-circle-fill geo-float" style="width: 30px; height: 30px; background-color: #ff8552; top: 26rem; left: 8rem; animation-delay: .6s;"></div>
        <div class="geo geo-dash" style="width: 90px; top: 20rem; left: 12rem; transform: rotate(-6deg);"></div>
        <div class="geo geo-plus geo-float" style="top: 26.5rem; left: 40%; animation-delay: 1.6s;"></div>
        <div class="geo geo-circle-outline geo-float" style="width: 26px; height: 26px; top: 5rem; left: 60%; animation-delay: 1.9s;"></div>
    </div>

    <h1 class="hero">Good Morning <br><span class="hero2">Everyone.</span></h1>
    <svg class="scribble-underline" width="220" height="24" viewBox="0 0 220 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M4 16C40 4 80 4 110 14C140 24 180 6 216 12" stroke="#ff8552" stroke-width="5" stroke-linecap="round"/>
    </svg>
    <p class="help">We are the Group #4</p>    
    <a class="link-button" href="aboutus.html">Get Started</a>

    <div class="dance-field" aria-hidden="true">
        <img class="dance-img" src="habitica.jpg" alt="" style="top: 8%;  left: 10%; width: 130px; height: 130px; --r: -6deg;  animation-delay: 0s;">
        <img class="dance-img" src="piktochart.jpg" alt="" style="top: 22%; left: 55%; width: 110px; height: 110px; --r: 8deg;   animation-delay: 1.2s;">
        <img class="dance-img" src="forks.jpg" alt="" style="top: 42%; left: 20%; width: 150px; height: 150px; --r: -4deg;  animation-delay: 2.4s;">
        <img class="dance-img" src="lexielearn.jpg" alt="" style="top: 60%; left: 60%; width: 120px; height: 120px; --r: 5deg;   animation-delay: 3.6s;">
        <img class="dance-img" src="thetawave.jpg" alt="" style="top: 78%; left: 15%; width: 135px; height: 135px; --r: -8deg;  animation-delay: 4.8s;">
    </div>
</body>
</html>
